<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <meta name="description" content="Tu dinero, más claro. Control financiero personal.">
  <title>FortunePay</title>
  <style>
    body{margin:0;background:#0b1110;color:#edf4ef;font-family:system-ui,sans-serif}
    .boot{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:25px;letter-spacing:3px}
    .boot span{color:#9be66b}.boot small{font-size:13px;font-weight:400;letter-spacing:0;color:#9aa99f;margin-top:12px}
    .boot .diagnostic{font-size:13px;letter-spacing:0;max-width:310px;text-align:center;line-height:1.6;margin:22px;padding:14px;border:1px solid #526448;border-radius:12px}
  </style>
</head>
<body>
  <div id="app"><div class="boot">FORTUNE<span>PAY</span><small>Preparando tus finanzas…</small></div></div>
  <script>
    (function(){
      var started=false;
      window.__fortunePayStarted=function(){started=true};
      function showProblem(message){
        if(started)return;
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div class="boot">FORTUNE<span>PAY</span><div class="diagnostic"><b>No pudimos iniciar la aplicación.</b><br>'+message+'<br><br>Comprueba tu conexión a internet y vuelve a abrir FortunePay. Si sigue ocurriendo, avísanos para revisar la compilación.</div></div>';
      }
      window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT')showProblem('No se pudo cargar el código de la app.');else if(e.message)showProblem('Error de inicio: '+String(e.message).slice(0,180));},true);
      window.addEventListener('unhandledrejection',function(e){showProblem('Error al conectar o iniciar sesión: '+String(e.reason&&e.reason.message||e.reason||'error desconocido').slice(0,180));});
      setTimeout(function(){showProblem('La pantalla inicial tardó demasiado en responder. Puede que el APK instalado no sea la última versión.');},12000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
